name: Examples

# Runs the tests of the examples in fiftyone_pipeline_cloudrequestengine/examples
# on demand.
#
# The examples are tested by common-ci on every Python version and operating
# system in ci/options.json, in the pull request and nightly workflows, because
# ci/run-integration-tests.ps1 lists them. This workflow is only for running
# them alone, on one Linux runner, without waiting for a full pipeline.
#
# The tests that call the cloud service read _51DEGREES_RESOURCE_KEY. It is
# set from the organisation's bespoke resource key, because that key carries
# the device detection, IP intelligence and translated country name
# properties the examples show.
#
# The secret is named rather than passed as toJSON(secrets), for the reason
# given in cloud-51did.yml.

on:
  workflow_dispatch:

jobs:
  examples:
    name: Examples
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fiftyone_pipeline_cloudrequestengine/examples
    steps:
      - uses: actions/checkout@v4
        with:
          # The client-side script is built from the JavaScript templates,
          # which are a submodule of the core package.
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install tox
        run: python -m pip install --upgrade pip tox
      - name: Test the examples
        env:
          _51DEGREES_RESOURCE_KEY: ${{ secrets._51DEGREES_RESOURCE_KEY_BESPOKE }}
        run: python -m tox -e py -- -v -rs
