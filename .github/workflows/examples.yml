name: Examples

# Runs the tests of the examples in the examples folder.
#
# The tests that call the cloud service read _51DEGREES_RESOURCE_KEY. It is
# set from the organisation's bespoke resource key, because that key carries
# the device detection, IP intelligence and translated country name
# properties the examples show.
#
# The secret is named rather than passed as toJSON(secrets), for the reason
# given in cloud-51did.yml.
#
# The cloud tests skip themselves when no key is set, and a pull request
# from a fork has no secrets. The other tests use a stand-in for the cloud
# service, so such a run still checks the examples.

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'examples/**'
      - 'fiftyone_pipeline_core/**'
      - 'fiftyone_pipeline_engines/**'
      - 'fiftyone_pipeline_cloudrequestengine/**'
      - '.github/workflows/examples.yml'
  push:
    branches: [main]
    paths:
      - 'examples/**'
      - 'fiftyone_pipeline_core/**'
      - 'fiftyone_pipeline_engines/**'
      - 'fiftyone_pipeline_cloudrequestengine/**'
      - '.github/workflows/examples.yml'

jobs:
  examples:
    name: Examples
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples
    steps:
      - uses: actions/checkout@v4
        with:
          # The client-side script is built from the JavaScript templates,
          # which are a submodule of the core package.
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install the examples and the Pipeline packages from this checkout
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Test the examples
        env:
          _51DEGREES_RESOURCE_KEY: ${{ secrets._51DEGREES_RESOURCE_KEY_BESPOKE }}
        run: python -m pytest -v -rs
