name: Cloud 51Did Tests

# Runs the live cloud 51Did integration test
# (fiftyone_pipeline_did/tests/test_did_client_live.py) once for every resource
# key the central common-ci script exports from the _51DEGREES_RESOURCE_KEY*
# secrets (free, paid and any added later). Each run sets the single
# _51DEGREES_RESOURCE_KEY the test reads. New resource keys are added once at
# the organisation level; this workflow needs no change.
#
# The test skips itself when no key is set, so a run with no secrets is green
# and proves nothing. That is deliberate, because a pull request from a fork
# has no secrets, and it is the reason the loop below reports which key each
# run used.

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'fiftyone_pipeline_did/**'
      - 'owid-python/**'
      - '.github/workflows/cloud-51did.yml'

jobs:
  cloud-51did:
    name: Cloud 51Did
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fiftyone_pipeline_did
    steps:
      - uses: actions/checkout@v4
        with:
          # tox installs owid from the owid-python submodule rather than PyPI.
          submodules: recursive
      - name: Checkout common-ci
        uses: actions/checkout@v4
        with:
          # Provides steps/set-resource-keys.ps1, the central script that
          # exports the _51DEGREES_RESOURCE_KEY* secrets as environment
          # variables.
          repository: 51Degrees/common-ci
          path: common-ci
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install tox
        run: python -m pip install --upgrade pip tox
      - name: Cloud 51Did test for each resource key secret
        shell: pwsh
        env:
          SECRETS: ${{ toJSON(secrets) }}
        run: |
          ../common-ci/steps/set-resource-keys.ps1 -Keys (ConvertFrom-Json -AsHashtable $env:SECRETS)
          $keys = Get-ChildItem env: |
            Where-Object { $_.Name -like '_51DEGREES_RESOURCE_KEY*' -and $_.Value }
          if (-not $keys) {
            Write-Host 'No _51DEGREES_RESOURCE_KEY* secrets available; skipping.'
            exit 0
          }
          $failed = $false
          foreach ($k in $keys) {
            Write-Host "::group::test_did_client_live with $($k.Name)"
            $env:_51DEGREES_RESOURCE_KEY = $k.Value
            tox -- tests/test_did_client_live.py -v
            if ($LASTEXITCODE -ne 0) { $failed = $true }
            Write-Host '::endgroup::'
          }
          if ($failed) { exit 1 }
