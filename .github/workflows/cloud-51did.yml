name: Cloud 51Did Tests

# Runs the live cloud 51Did integration test
# (fiftyone_pipeline_did/tests/test_did_client_live.py) once for every
# _51DEGREES_RESOURCE_KEY* secret passed in below. Each run sets the single
# _51DEGREES_RESOURCE_KEY the test reads.
#
# The secrets are named one by one rather than passed as toJSON(secrets).
# GitHub marks a workflow that hands every secret to a step as possibly
# malicious and holds each run for manual approval, so the nightly never ran.
# A new resource key therefore needs a line here as well as the organisation
# secret.
#
# The test skips itself when no key is set, so a run with no secrets is green
# and proves nothing. That is deliberate, because a pull request from a fork
# has no secrets, and it is the reason the loop below reports which key each
# run used.

on:
  workflow_dispatch:
  # Nightly as well, because a pull_request run only ever checks the package
  # against the cloud as it stood that day. A released package is not checked
  # again, so a field the cloud starts writing, stops writing or changes goes
  # unnoticed until a customer finds it. That is what happened when the cloud service began
  # writing the Terms byte. The six 51Did packages are
  # staggered ten minutes apart so they do not all ask production at once.
  schedule:
    - cron: '30 5 * * *'
  pull_request:
    branches: [main]
    paths:
      - 'fiftyone_pipeline_did/**'
      - 'owid-python/**'
      - '.github/workflows/cloud-51did.yml'

jobs:
  cloud-51did:
    name: Cloud 51Did
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fiftyone_pipeline_did
    steps:
      - uses: actions/checkout@v4
        with:
          # tox installs owid from the owid-python submodule rather than PyPI.
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Copy the OWID source into the package
        # setup.py declares fiftyone_pipeline_did._owid as a package, and it
        # is copied out of the owid-python submodule rather than committed,
        # so without this the wheel build fails with "package directory
        # 'src/fiftyone_pipeline_did/_owid' does not exist" before any test
        # runs.
        shell: pwsh
        working-directory: .
        run: ./ci/copy-owid-source.ps1
      - name: Install tox
        run: python -m pip install --upgrade pip tox
      - name: Cloud 51Did test for each resource key secret
        shell: pwsh
        env:
          _51DEGREES_RESOURCE_KEY_FREE: ${{ secrets._51DEGREES_RESOURCE_KEY_FREE }}
          _51DEGREES_RESOURCE_KEY_PAID: ${{ secrets._51DEGREES_RESOURCE_KEY_PAID }}
          _51DEGREES_RESOURCE_KEY_BESPOKE: ${{ secrets._51DEGREES_RESOURCE_KEY_BESPOKE }}
        run: |
          $keys = Get-ChildItem env: |
            Where-Object { $_.Name -like '_51DEGREES_RESOURCE_KEY*' -and $_.Value }
          if (-not $keys) {
            Write-Host 'No _51DEGREES_RESOURCE_KEY* secrets available; skipping.'
            exit 0
          }
          $failed = $false
          foreach ($k in $keys) {
            Write-Host "::group::test_did_client_live with $($k.Name)"
            $env:_51DEGREES_RESOURCE_KEY = $k.Value
            tox -- tests/test_did_client_live.py -v
            if ($LASTEXITCODE -ne 0) { $failed = $true }
            Write-Host '::endgroup::'
          }
          if ($failed) { exit 1 }
