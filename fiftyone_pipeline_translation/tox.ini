[tox]
minversion = 4.0

[common]
deps =
    pytest>=6
    pytest-cov

[testenv]
description = run the tests with pytest
package = wheel
wheel_build_env = .pkg
deps =
    {[common]deps}
    -e../fiftyone_pipeline_core/
commands =
    pytest --cov={envsitepackagesdir}/fiftyone_pipeline_translation {tty:--color=yes} {posargs}

[testenv:pre-publish]
package = skip
deps =
    {[common]deps}
    -r ../../package/pre-publish-requirements.txt
