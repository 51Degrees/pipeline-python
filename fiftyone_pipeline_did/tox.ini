[tox]
minversion = 4.0

[common]
deps =
    pytest>=6
    pytest-cov

[testenv]
description = run the tests with pytest
package = wheel
wheel_build_env = .pkg
# tox runs the tests in a clean environment and strips anything it is not
# told to keep, so without this the live cloud tests never see the resource
# key and skip themselves on every run, which reads as a pass.
passenv =
    _51DEGREES_RESOURCE_KEY
    _51DEGREES_LICENSE_KEY
    resource_key
    license_key
    FOD_CLOUD_API_URL
deps =
    {[common]deps}
    # owid is provided by the 51Degrees fork submodule (../owid-python), not
    # PyPI; installing it editable satisfies this package's owid requirement.
    -e../owid-python/
commands =
    pytest --cov=fiftyone_pipeline_did {tty:--color=yes} {posargs}

[testenv:pre-publish]
description = run the tests with pytest
package = wheel
wheel_build_env = .pkg
deps =
    {[common]deps}
    -e../owid-python/
commands =
    pytest --cov=fiftyone_pipeline_did {tty:--color=yes} {posargs}
